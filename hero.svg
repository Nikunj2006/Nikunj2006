<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360">
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0" stop-color="#FFDCC8"/>
    <stop offset=".34" stop-color="#E8F5F7"/>
    <stop offset=".68" stop-color="#E7E0F5"/>
    <stop offset="1" stop-color="#D9EFE7"/>
  </linearGradient>
  <style>
    .float{animation:float 4s ease-in-out infinite}
    .float2{animation:float 5s ease-in-out infinite reverse}
    .dash{animation:dash 7s linear infinite}
    @keyframes float{50%{transform:translateY(-12px)}}
    @keyframes dash{to{stroke-dashoffset:-80}}
  </style>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<circle class="float" cx="1050" cy="82" r="48" fill="#F5B38D" opacity=".55"/>
<circle class="float2" cx="112" cy="278" r="58" fill="#A9D8D1" opacity=".6"/>
<path class="dash" d="M80 305 C270 220 380 330 560 250 S860 160 1120 265" fill="none" stroke="#263238" stroke-width="3" stroke-dasharray="12 12" opacity=".25"/>
<g fill="#1F2937" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">
  <text x="600" y="142" font-size="55" font-weight="800" letter-spacing="3">NIKUNJ BHARADIYA</text>
  <text x="600" y="193" font-size="21" letter-spacing="6" fill="#4B5563">COMPUTER SCIENCE × DATA SCIENCE</text>
  <text x="600" y="236" font-size="17" letter-spacing="3" fill="#6B7280">BUILDING • BREAKING • LEARNING • REPEATING</text>
</g>
<g class="float" fill="#fff" opacity=".9">
 <rect x="72" y="62" width="112" height="42" rx="21"/>
 <text x="128" y="89" text-anchor="middle" font-family="monospace" font-size="15" fill="#374151">C++ / DSA</text>
</g>
<g class="float2" fill="#fff" opacity=".9">
 <rect x="1016" y="266" width="112" height="42" rx="21"/>
 <text x="1072" y="293" text-anchor="middle" font-family="monospace" font-size="15" fill="#374151">PYTHON / ML</text>
</g>
</svg>